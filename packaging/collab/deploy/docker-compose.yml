# Production stack: the VectorCraft Cloud container. Caddy (HTTPS) runs on the host from the
# Ubuntu package and proxies to 127.0.0.1:1234. Installed into /opt/vectorcraft by install.sh;
# settings come from .env next to this file.
services:
  vectorcraft:
    image: ${IMAGE:-ghcr.io/milkpack/vectorcraft-cloud:latest}
    restart: unless-stopped
    environment:
      RUST_LOG: info
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:1234:1234"
