# Builds the Photo Studio image (Rust server + React front-end) and publishes it to GitHub
# Container Registry, so a small VPS only pulls it instead of compiling.
#   ghcr.io/<owner>/photo-studio:latest   (default branch and the Photo Studio branch)
#   ghcr.io/<owner>/photo-studio:<sha>
name: photo-studio-image

on:
  push:
    branches: [main, "claude/clever-cray-*"]
    paths:
      - "apps/photo-studio/**"
      - ".claude/skills/photo-studio/**"
      - "packaging/photo-studio/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/photo-studio-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: photo-studio-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/photo-studio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Own cache scope: the default one is shared with collab-image, and each would evict the other.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/photo-studio/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=photo-studio
          cache-to: type=gha,scope=photo-studio,mode=max
