# Builds the VectorCraft Cloud image (web app + collaboration server) and publishes it to
# GitHub Container Registry, so a small VPS only pulls it instead of compiling Rust.
#   ghcr.io/<owner>/vectorcraft-cloud:latest   (default branch and the collab branch)
#   ghcr.io/<owner>/vectorcraft-cloud:<sha>
name: collab-image

on:
  push:
    branches: [main, "claude/cloud-illustrator-collab-*"]
    paths:
      - "apps/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/collab/**"
      - ".github/workflows/collab-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: collab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the Rust build needs ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vectorcraft-cloud" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/collab/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
